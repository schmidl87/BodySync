name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Body Sync project
        shell: bash
        run: |
          set -e

          rm -rf app-src
          mkdir -p app-src

          echo "=== ZIP contents ==="
          unzip -l BodySync-v0.2.3.zip

          echo "=== Extracting Body Sync ==="
          unzip -q BodySync-v0.2.3.zip -d app-src

          echo "=== Project root ==="
          ls -la app-src

      - name: Prepare project
        shell: bash
        run: |
          set -e

          if [ -f "app-src/settings.gradle.kts" ]; then
            echo "Project found directly in app-src."

          elif [ -f "app-src/BodySync/settings.gradle.kts" ]; then
            echo "Project found in nested BodySync folder."

            shopt -s dotglob
            cp -R app-src/BodySync/* app-src/
            rm -rf app-src/BodySync

          else
            echo "ERROR: Gradle project not found."
            ls -la app-src
            exit 1
          fi

          test -f app-src/settings.gradle.kts
          test -f app-src/build.gradle.kts
          test -d app-src/app

          echo "Body Sync Gradle project verified."

      - name: Build Debug APK
        shell: bash
        working-directory: app-src
        run: |
          set -e

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building Body Sync v0.2.3 ==="
          gradle assembleDebug --stacktrace --no-daemon

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app-src/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=== APK successfully created ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.2.3-debug
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
