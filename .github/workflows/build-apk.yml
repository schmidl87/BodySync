name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Body Sync project
        run: |
          set -e
          rm -rf app-src
          mkdir -p app-src
          unzip -q BodySync-v0.2.1.zip -d app-src

          if [ -d "app-src/BodySync" ]; then
            shopt -s dotglob
            mv app-src/BodySync/* app-src/
            rmdir app-src/BodySync
          fi

          echo "Project files:"
          find app-src -maxdepth 3 -type f | sort

      - name: Make Gradle executable
        run: chmod +x app-src/gradlew

      - name: Build Debug APK
        working-directory: app-src
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find app-src -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-debug-apk
          path: app-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
