name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Body Sync project
        run: |
          set -e

          rm -rf app-src
          mkdir -p app-src

          unzip -q BodySync-v0.2.2.zip -d app-src

          echo "=== Extracted Body Sync project ==="
          find app-src -maxdepth 4 -
