name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Body Sync
        run: unzip -q BodySync-v0.8.0.zip -d body-sync-build

      - name: Check project
        run: |
          test -f body-sync-build/settings.gradle.kts
          test -f body-sync-build/build.gradle.kts
          test -f body-sync-build/app/build.gradle.kts
          echo "Body Sync project found."

      - name: Build APK
        working-directory: body-sync-build
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.8.0-debug
          path: body-sync-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
