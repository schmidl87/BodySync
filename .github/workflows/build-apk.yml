name: Build Body Sync v0.5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare project
        run: |
          set -e

          rm -rf app-src
          mkdir -p app-src

          unzip -q BodySync-v0.5.3.zip -d app-src

          echo "Project files:"
          find app-src -maxdepth 3 -type f | sort

      - name: Detect Gradle project
        run: |
          set -e

          if [ -f "app-src/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=app-src" >> "$GITHUB_ENV"

          elif [ -f "app-src/BodySync-v0.5.3/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=app-src/BodySync-v0.5.3" >> "$GITHUB_ENV"

          elif [ -f "app-src/BodySync/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=app-src/BodySync" >> "$GITHUB_ENV"

          else
            echo "ERROR: settings.gradle.kts not found"
            find app-src -name settings.gradle.kts -print
            exit 1
          fi

      - name: Verify project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project root:"
          pwd

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Gradle project looks OK."

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.5.3-debug
          path: ${{ env.APK }}
          if-no-files-found: error
