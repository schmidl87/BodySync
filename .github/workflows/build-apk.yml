name: Build Body Sync APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Body Sync v0.12.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path './.git/*' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle project found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Gradle project: $PROJECT_DIR"

      - name: Verify update identity
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q 'applicationId = "com.bodysync.app"' app/build.gradle.kts
          grep -q 'versionCode = 23' app/build.gradle.kts
          test -f bodysync-test.keystore

          echo "Package ID and signing keystore verified."

      - name: Build signed update APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Body Sync APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.12.1-update
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
