name: Build Body Sync APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Body Sync v0.12.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find or extract Body Sync project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          # If a Body Sync ZIP was uploaded to the repository,
          # extract it into the repository root.
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "BodySync*.zip" -o -iname "*.zip" \) \
            | head -1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p .bodysync_extract
            unzip -o "$ZIP_FILE" -d .bodysync_extract

            # Move project files from the extracted project root
            # into the repository root.
            PROJECT_DIR=$(find .bodysync_extract -type f \
              -name "settings.gradle.kts" \
              -print -quit \
              | xargs -r dirname)

            if [ -n "$PROJECT_DIR" ]; then
              echo "Gradle project found at: $PROJECT_DIR"

              cp -a "$PROJECT_DIR"/. ./

              rm -rf .bodysync_extract
            fi
          fi

          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find . -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "./.git/*" \
            -not -path "./.bodysync_extract/*" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project found."
            echo "settings.gradle.kts/settings.gradle is missing."
            exit 1
          fi

          echo "Gradle project directory: $PROJECT_DIR"

          # Save the project directory for the next step.
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          ls -la

          echo
          echo "Gradle files:"
          find . -maxdepth 2 -type f \
            \( -name "settings.gradle*" -o -name "build.gradle*" \) \
            -print

      - name: Build Body Sync APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload Body Sync APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.12.0
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
