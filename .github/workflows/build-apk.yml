name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Body Sync project
        shell: bash
        run: |
          set -e

          rm -rf app-src
          mkdir -p app-src

          unzip -q BodySync-v0.3.1.zip -d app-src

          echo "=== Extracted project ==="
          ls -la app-src

      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "app-src/settings.gradle.kts" ]; then
            echo "PROJECT_ROOT=app-src" >> "$GITHUB_ENV"

          elif [ -f "app-src/BodySync-v0.3.1/settings.gradle.kts" ]; then
            echo "PROJECT_ROOT=app-src/BodySync-v0.3.1" >> "$GITHUB_ENV"

          elif [ -f "app-src/BodySync/settings.gradle.kts" ]; then
            echo "PROJECT_ROOT=app-src/BodySync" >> "$GITHUB_ENV"

          else
            echo "ERROR: Could not find settings.gradle.kts."
            ls -R app-src
            exit 1
          fi

          echo "Gradle project: $PROJECT_ROOT"

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -d "$PROJECT_ROOT/app"

          echo "Gradle project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle assembleDebug --stacktrace --no-daemon

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "=== APK successfully generated ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.3.1-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
