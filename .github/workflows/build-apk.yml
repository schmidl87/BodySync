name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Body Sync ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BodySync-v0.7.2.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "BodySync-v0.7.2.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          set -e

          rm -rf body-sync-build
          mkdir -p body-sync-build

          unzip -q "$ZIP_FILE" -d body-sync-build

          echo "Extracted project:"
          ls -la body-sync-build

      - name: Build APK
        working-directory: body-sync-build
        run: |
          set -e

          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          set -e

          APK_FILE=$(find body-sync-build/app/build/outputs/apk -type f -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.7.2-debug
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
