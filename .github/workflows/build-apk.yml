name: Build Body Sync APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Body Sync v0.12.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          fi

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="./BodySync-v0.12.4-update-fixed.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "ERROR: Required ZIP not found: $ZIP_FILE"
              find . -type f -iname 'BodySync*.zip' \
                -not -path './.git/*' \
                -print | sort || true
              exit 1
            fi

            echo "Using Body Sync ZIP: $ZIP_FILE"

            rm -rf .bodysync_extract
            mkdir -p .bodysync_extract

            unzip -q -o "$ZIP_FILE" -d .bodysync_extract

            PROJECT_DIR="$(find .bodysync_extract -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print -quit | xargs -r dirname || true)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: ZIP does not contain a Gradle project."
              exit 1
            fi
          fi

          echo "Gradle project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify update identity
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q 'applicationId = "com.bodysync.app"' app/build.gradle.kts
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "0.12.4"' app/build.gradle.kts

          test -f bodysync-test.keystore

          echo "Update identity verified."

      - name: Build signed update APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Upload Body Sync APK
        uses: actions/upload-artifact@v4
        with:
          name: BodySync-v0.12.4-update
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
