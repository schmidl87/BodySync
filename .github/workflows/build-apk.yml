name: Build Body Sync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Body Sync ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BodySync-v0.8.0.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BodySync-v0.8.0.zip not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf body-sync-build
          mkdir -p body-sync-build

          unzip -q "$ZIP_FILE" -d body-sync-build

          echo "Project files:"
          find body-sync-build -maxdepth 2 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "body-sync-build/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          if [
